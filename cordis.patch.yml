# dsh-simple-desktop bundle patch: one host-plane plugin that turns the DeepSeek
# Harness web UI into a minimal native Windows desktop shell (desktop shortcut,
# WebView2 window, system-tray icon, single instance, high-DPI). The plugin is a
# no-op on non-Windows platforms and never fails the boot: every problem is
# logged as a warning.
#
# All configuration is optional and workspace-derived by default:
#   - workingDir defaults to process.cwd() (your DSH workspace root)
#   - iconPath defaults to <workspace>/icon.png, then a bundled icon
# Override them in your profile's cordis.patch.yml if needed, e.g.:
#
#   - id: dsh-simple-desktop
#     config:
#       shortcutName: 'DeepSeek Harness'
#       url: 'http://127.0.0.1:3080'
#       iconPath: 'C:\path\to\icon.png'
#       workingDir: 'C:\path\to\workspace'
- insert:
    - id: dsh-simple-desktop
      name: 'dsh-simple-desktop'
