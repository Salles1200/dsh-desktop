# dsh-desktop bundle patch: one host-plane plugin that turns the DeepSeek
# Harness web UI into a native Windows desktop app (WebView2 window, system-tray
# icon, desktop shortcut, high-DPI). The plugin is a no-op on non-Windows
# platforms and never fails the boot: every problem is logged as a warning.
- insert:
    - id: dsh-desktop
      name: 'dsh-desktop'
      config:
        shortcutName: 'DeepSeek Harness'
        url: 'http://127.0.0.1:3080'
        iconPath: 'D:\AI\DeepSeek-Harness\deepseek-color.png'
        workingDir: 'D:\AI\DeepSeek-Harness'
